<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>מדידת נקודות</title>
<style>
:root{color-scheme:light dark;--bg:light-dark(#fffaf0,#0d1330);--ink:light-dark(#1b1f2e,#eef0f8);--card:light-dark(#fff,#18204a);--line:light-dark(#e8dfca,#2d3770);--mut:light-dark(#5d6275,#a8afcc);--night:#13235b;--gold:#f4b400;--ok:#2f9e57;--bad:#d63a2f}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 system-ui,sans-serif}
header{background:var(--night);color:#fff;padding:14px 18px;padding-top:max(14px,env(safe-area-inset-top))}
h1{margin:0;font-size:22px}
main{padding:16px;max-width:560px;margin:0 auto}
.live{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;text-align:center}
.co{font:600 22px ui-monospace,monospace;direction:ltr}
.acc{margin-top:6px;font-weight:700}
.acc.good{color:var(--ok)}.acc.bad{color:var(--bad)}
.labels{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:16px 0 10px}
.labels button,.btn{min-height:48px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);font:700 18px system-ui}
.labels button.on{background:var(--gold);border-color:var(--gold);color:#1b1f2e}
.btn{width:100%;background:var(--night);color:#fff;border:0;margin-top:8px}
.btn:disabled{opacity:.6}
.btn.ghost{background:none;color:var(--ink);border:2px solid var(--line)}
.bar{height:8px;background:var(--line);border-radius:4px;margin-top:10px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:var(--gold);transition:width .3s}
ul{list-style:none;padding:0;margin:16px 0 0}
li{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
li b{font-size:18px}li span{direction:ltr;font-family:ui-monospace,monospace;font-size:14px;color:var(--mut)}
.hint{color:var(--mut);font-size:14px}
textarea{width:100%;min-height:120px;margin-top:8px;font:14px ui-monospace,monospace;direction:ltr}
</style>
</head>
<body>
<header><h1>מדידת נקודות עיגון</h1></header>
<main>
  <div class="live"><div class="co" id="co">מחכה ל-GPS…</div><div class="acc" id="acc"></div></div>
  <div class="labels" id="labels"></div>
  <button class="btn" id="go">מדידה בנקודה A (20 שניות)</button>
  <div class="bar"><i id="bar"></i></div>
  <p class="hint">עמדו במרכז הצומת, החזיקו את הטלפון פתוח ואל תזוזו עד סוף המדידה. רצוי דיוק של ±10 מ' או פחות.</p>
  <ul id="list"></ul>
  <button class="btn ghost" id="copy">העתקת כל הנקודות</button>
  <div id="out"></div>
  <button class="btn ghost" id="clear">ניקוי הרשימה</button>
</main>
<script>
{
const $=s=>document.querySelector(s),L=['A','B','C','D','E','F'];let cur='A',last=null,samp=null,saved={};
try{saved=JSON.parse(localStorage.getItem('anchors'))||{}}catch(e){}
const save=()=>{try{localStorage.setItem('anchors',JSON.stringify(saved))}catch(e){}};
function drawLabels(){$('#labels').innerHTML=L.map(l=>`<button data-l="${l}" class="${l===cur?'on':''}">${l}${saved[l]?' ✓':''}</button>`).join('');$('#go').textContent=`מדידה בנקודה ${cur} (20 שניות)`}
function drawList(){$('#list').innerHTML=L.filter(l=>saved[l]).map(l=>`<li><b>${l}</b><span>${saved[l].lat.toFixed(6)}, ${saved[l].lng.toFixed(6)} · ±${saved[l].acc} מ'</span></li>`).join('')}
$('#labels').onclick=e=>{const b=e.target.closest('button');if(b){cur=b.dataset.l;drawLabels()}};
navigator.geolocation.watchPosition(p=>{const c=p.coords;last=c;$('#co').textContent=`${c.latitude.toFixed(6)}, ${c.longitude.toFixed(6)}`;const a=$('#acc');a.textContent=`דיוק ±${Math.round(c.accuracy)} מ'`;a.className='acc '+(c.accuracy<=10?'good':'bad');},
  e=>{$('#co').textContent='אין גישה למיקום. אשרו הרשאה בהגדרות.'},{enableHighAccuracy:true,maximumAge:0});
$('#go').onclick=()=>{if(samp)return;samp=[];const b=$('#go');b.disabled=true;let t=0;const iv=setInterval(()=>{t++;if(last&&last.accuracy<=25)samp.push(last);$('#bar').style.width=t*5+'%';if(t<20)return;clearInterval(iv);
  const s=samp;samp=null;b.disabled=false;$('#bar').style.width='0';if(!s.length){b.textContent='לא התקבל מיקום מדויק, נסו שוב';return}
  let w=0,la=0,ln=0,ac=1e9;for(const c of s){const k=1/(c.accuracy*c.accuracy);w+=k;la+=c.latitude*k;ln+=c.longitude*k;ac=Math.min(ac,c.accuracy)}
  saved[cur]={lat:la/w,lng:ln/w,acc:Math.round(ac),n:s.length};save();const i=L.indexOf(cur);if(i<L.length-1)cur=L[i+1];drawLabels();drawList()},1000)};
$('#copy').onclick=async()=>{const t=L.filter(l=>saved[l]).map(l=>`${l} ${saved[l].lat.toFixed(7)}, ${saved[l].lng.toFixed(7)} ±${saved[l].acc}`).join('\n');try{await navigator.clipboard.writeText(t);$('#copy').textContent='הועתק!'}catch(e){$('#out').innerHTML=`<textarea readonly>${t}</textarea>`}};
let arm=0;$('#clear').onclick=()=>{if(!arm){arm=1;$('#clear').textContent='לחצו שוב לאישור';setTimeout(()=>{arm=0;$('#clear').textContent='ניקוי הרשימה'},3000);return}saved={};save();drawLabels();drawList()};
drawLabels();drawList();
}
</script>
</body>
</html>
