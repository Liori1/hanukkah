<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>אור במושב</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700&family=Suez+One&display=swap" rel="stylesheet">
<style>
/* VOICE: a family Hanukkah adventure — warm, playful, clear for kids and adults
   IDEA: a hand-drawn treasure map of the moshav, lit by Hanukkah candle-gold
   PICTURE: the zoomable drawn map itself, full screen, with floating station badges
   COLOUR and TYPE: night blue #13235b chrome, candle gold accent, paper map; Suez One + Assistant
   LAYOUT: slim header, map fills the rest, bottom sheets for riddles, admin and the final code */
:root{color-scheme:light dark;--bg:light-dark(#fffaf0,#0d1330);--ink:light-dark(#1b1f2e,#eef0f8);--card:light-dark(#ffffff,#18204a);--line:light-dark(#e8dfca,#2d3770);--mut:light-dark(#5d6275,#a8afcc);--night:#13235b;--gold:#f4b400;--lock:#8b90a0;--open:#f0a500;--bad:#d63a2f;--ok:#2f9e57}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Assistant,system-ui,sans-serif;overflow:hidden;display:flex;flex-direction:column;height:100dvh}
h1,h2,h3,.f{font-family:"Suez One",Assistant,serif;font-weight:400}
button{font:inherit;cursor:pointer}
header{background:var(--night);color:#fff;display:flex;align-items:center;gap:12px;padding:10px 14px;padding-top:max(10px,env(safe-area-inset-top));flex:none}
#title{margin:0;font-size:22px;line-height:1.1;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;display:flex;align-items:center;gap:8px}
#title svg{flex:none}
#title small{display:block;font:600 13px Assistant,sans-serif;color:#c9d2f5}
#prog{margin-inline-start:auto;text-align:center;white-space:nowrap}
#prog b{font:22px "Suez One",serif;color:var(--gold)}
#prog span{display:block;font-size:13px;color:#c9d2f5;line-height:1}
#vp{position:relative;flex:1;overflow:hidden;touch-action:none;background:#e9dfc6;user-select:none;-webkit-user-select:none}
#world{position:absolute;left:0;top:0;width:1000px;height:1300px;transform-origin:0 0;will-change:transform}
#world.anim{transition:transform .35s ease}
#map{display:block;width:1000px;height:1300px;-webkit-user-drag:none;pointer-events:none}
.pin{position:absolute;width:0;height:0;border:0;padding:0;background:none}
.pin .w{position:absolute;left:0;top:0;transform:translate(-50%,-50%) scale(var(--i,1));display:flex;flex-direction:column;align-items:center;gap:3px}
.pin .b{position:relative;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;color:#fff;font:22px "Suez One",serif;border:3px solid #fff;box-shadow:0 3px 0 rgba(0,0,0,.18),0 6px 14px rgba(0,0,0,.25);background:var(--c)}
.pin .g{position:absolute;bottom:-5px;left:-5px;width:22px;height:22px;border-radius:50%;background:#fff;display:grid;place-items:center}
.pin .l{background:rgba(255,255,255,.92);color:#2a2418;font:700 13px Assistant,sans-serif;padding:1px 8px;border-radius:9px;white-space:nowrap;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.pin.locked{--c:var(--lock)}.pin.open{--c:var(--open)}.pin.wrong{--c:var(--bad)}.pin.solved{--c:var(--ok)}
.pin.safe{--c:var(--night)}
.pin.safe .b{width:56px;height:56px;border-color:var(--gold);animation:glow 1.6s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 0 10px rgba(244,180,0,.35),0 6px 14px rgba(0,0,0,.25)}}
.me{position:absolute;width:0;height:0;display:none}
.me i{position:absolute;left:0;top:0;transform:translate(-50%,-50%);border-radius:50%}
.pin.hinted .b{animation:ping 1.4s ease-out infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(244,180,0,.8),0 6px 14px rgba(0,0,0,.25)}80%,100%{box-shadow:0 0 0 18px rgba(244,180,0,0),0 6px 14px rgba(0,0,0,.25)}}
.me .arr{display:none;transform:translate(-50%,-50%) rotate(var(--a,0rad)) scale(var(--i,1))}
.me.out .arr{display:block}.me.out .acc{display:none}.me.out .dot{background:#6f86c9}
.hintimg{width:100%;border-radius:12px;margin:4px 0 12px;display:block;border:1px solid var(--line)}
.me .acc{background:rgba(40,110,255,.15);border:1px solid rgba(40,110,255,.4)}
.me .dot{width:18px;height:18px;background:#2b6dff;border:3px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4);transform:translate(-50%,-50%) scale(var(--i,1))}
#ctl{position:absolute;top:12px;left:12px;display:flex;flex-direction:column;gap:8px}
#ctl button{width:44px;height:44px;border-radius:12px;border:0;background:var(--card);color:var(--ink);box-shadow:0 2px 8px rgba(0,0,0,.22);display:grid;place-items:center;font-size:24px;line-height:1}
#gps{position:absolute;top:12px;right:12px;max-width:62%;background:var(--card);color:var(--mut);font-size:13px;padding:4px 10px;border-radius:10px;box-shadow:0 2px 8px rgba(0,0,0,.18);display:none}
#legend{position:absolute;bottom:max(12px,env(safe-area-inset-bottom));right:12px;left:12px;display:flex;flex-wrap:wrap;gap:6px 12px;justify-content:center;background:color-mix(in srgb,var(--card) 92%,transparent);padding:6px 12px;border-radius:12px;font-size:13px;box-shadow:0 2px 8px rgba(0,0,0,.18);pointer-events:none}
#legend i{display:inline-block;width:12px;height:12px;border-radius:50%;margin-inline-end:5px;vertical-align:-1px}
#demo{position:absolute;bottom:calc(max(12px,env(safe-area-inset-bottom)) + 44px);right:12px;left:12px;background:var(--night);color:#fff;font-size:13px;padding:8px 40px 8px 12px;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.25)}
#demo b{color:var(--gold)}
#demo button{position:absolute;left:4px;top:50%;transform:translateY(-50%);width:36px;height:36px;border:0;background:none;color:#fff;font-size:20px}
#sheet{position:fixed;inset:0;background:rgba(8,12,30,.5);display:flex;align-items:flex-end;justify-content:center;z-index:5}
#sheet[hidden]{display:none}
.card{background:var(--card);color:var(--ink);width:100%;max-width:560px;max-height:88dvh;overflow:auto;border-radius:20px 20px 0 0;padding:20px 20px max(22px,env(safe-area-inset-bottom));box-shadow:0 -6px 30px rgba(0,0,0,.3);animation:up .25s ease}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.card h2{margin:0 0 4px;font-size:28px;line-height:1.1}
.card .sub{color:var(--mut);font-size:14px;margin:0 0 14px}
.card .x{float:left;width:44px;height:44px;border:0;background:none;color:var(--mut);font-size:26px;margin:-10px -10px 0 0}
.rt{font-size:18px;margin:0 0 16px}
.row{display:flex;gap:8px}
.row input{flex:1;font:inherit;font-size:18px;padding:11px 14px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink);min-height:48px}
.row input:focus{outline:none;border-color:var(--gold)}
.btn{border:0;border-radius:12px;padding:0 18px;min-height:48px;background:var(--night);color:#fff;font-weight:700}
.btn.gold{background:var(--gold);color:#1b1f2e}
.btn.ghost{background:none;color:var(--ink);border:2px solid var(--line)}
.btn.red{background:var(--bad)}
.btn:focus-visible,.pin:focus-visible .b,#ctl button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.msg{margin:12px 0 0;padding:10px 14px;border-radius:12px;font-weight:600}
.msg.bad{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad)}
.msg.ok{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.hint{margin-top:12px;color:var(--mut);font-size:15px}
.linkb{border:0;background:none;color:var(--mut);text-decoration:underline;padding:10px 0;min-height:44px}
.shake{animation:sh .35s}
@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.code{display:flex;gap:10px;justify-content:center;margin:18px 0;direction:ltr}
.code span{width:clamp(54px,17vw,72px);height:clamp(72px,22vw,92px);display:grid;place-items:center;background:var(--night);color:var(--gold);font:clamp(40px,12vw,56px) "Suez One",serif;border-radius:14px;box-shadow:inset 0 -6px 0 rgba(0,0,0,.25)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin:6px 0 16px}
.tile{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.tile b{display:block;font:26px "Suez One",serif;line-height:1.1;white-space:nowrap}
.tile span{font-size:13px;color:var(--mut)}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:right}
th{font-size:13px;color:var(--mut);font-weight:600}
td.n{text-align:left;white-space:nowrap;font-variant-numeric:tabular-nums}
.log{margin:6px 0 0;padding:0;list-style:none;font-size:14px}
.log li{padding:6px 0;border-bottom:1px dashed var(--line)}
.sec{margin:20px 0 6px;font-size:18px}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.demo-scan{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
textarea{width:100%;min-height:140px;font:14px/1.4 Assistant,sans-serif;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:8px;margin-top:8px}
#toast{position:fixed;top:calc(max(10px,env(safe-area-inset-top)) + 62px);left:50%;transform:translate(-50%,-20px);opacity:0;background:var(--night);color:#fff;padding:10px 18px;border-radius:12px;font-weight:600;transition:.25s;z-index:9;pointer-events:none;box-shadow:0 4px 16px rgba(0,0,0,.3);max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
@media(max-width:600px){table{font-size:13px}.stack thead{display:none}.stack tr{display:grid;padding-block:8px;border-bottom:1px solid var(--line)}.stack td{display:flex;justify-content:space-between;gap:12px;border:0;padding:3px 0;text-align:right}.stack td::before{content:attr(data-l);color:var(--mut)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header>
  <h1 id="title"><svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true"><path d="M15 3c3 4 4 6 0 10-4-4-3-6 0-10z" fill="#f4b400"/><rect x="12.5" y="13" width="5" height="12" rx="1" fill="#fff"/><rect x="5" y="25" width="20" height="3" rx="1.5" fill="#c9d2f5"/></svg><span>אור במושב<small>חדר בריחה של חנוכה</small></span></h1>
  <div id="prog"><b id="pn">0/0</b><span>חידות נפתרו</span></div>
</header>
<main id="vp" aria-label="מפת המושב">
  <div id="world">
    <svg id="map" viewBox="0 0 1000 1300" aria-hidden="true">
      <defs>
        <pattern id="rows" width="22" height="22" patternUnits="userSpaceOnUse" patternTransform="rotate(-20)"><rect width="22" height="22" fill="#cfe0a4"/><path d="M0 11H22" stroke="#b6cd86" stroke-width="7"/></pattern>
        <pattern id="wheat" width="20" height="20" patternUnits="userSpaceOnUse" patternTransform="rotate(28)"><rect width="20" height="20" fill="#ead98f"/><path d="M0 10H20" stroke="#d8c26f" stroke-width="6"/></pattern>
        <pattern id="awn" width="16" height="16" patternUnits="userSpaceOnUse"><rect width="8" height="16" fill="#d64b3a"/><rect x="8" width="8" height="16" fill="#fff"/></pattern>

        <g id="tree"><ellipse cx="4" cy="15" rx="15" ry="5" fill="#000" opacity=".12"/><circle r="15" fill="#5f9e4a" stroke="#3f6e31" stroke-width="2"/><circle cx="-5" cy="-5" r="5" fill="#8cc466"/></g>
      </defs>
      <rect width="1000" height="1300" fill="#f3ead6"/>
      <g stroke="#9fb46e" stroke-width="3" stroke-linejoin="round">

      <g id="houses"></g>

      <g transform="translate(500 395)" stroke="#6b5a45" stroke-width="2.5" stroke-linejoin="round">
        <ellipse cx="4" cy="34" rx="62" ry="8" fill="#000" opacity=".1" stroke="none"/>
        <rect x="-52" y="-28" width="104" height="60" rx="3" fill="#f7efdf"/>

        <rect x="-58" y="-26" width="116" height="52" rx="3" fill="#fbf4e4"/>
        <path d="M-64-26H64L58-8H-58Z" fill="url(#awn)"/>

      <g id="orchard"></g>

      <g transform="translate(790 1060)" stroke="#5c2c22" stroke-width="2.5" stroke-linejoin="round">

      </g>

    <div id="pins"></div>
    <div class="me" id="me"><i class="acc" id="acc"></i><i class="arr"><svg width="64" height="64" viewBox="0 0 64 64"><path d="M44 22L60 32L44 42Z" fill="#2b6dff" stroke="#fff" stroke-width="3" stroke-linejoin="round"/></svg></i><i class="dot"></i></div>
  </div>
  <div id="ctl">
    <button id="zin" aria-label="הגדלה">+</button>
    <button id="zout" aria-label="הקטנה">−</button>
    <button id="zfit" aria-label="כל המפה"><svg width="22" height="22" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M3 8V3h5M14 3h5v5M19 14v5h-5M8 19H3v-5"/></svg></button>
    <button id="zme" aria-label="המיקום שלי"><svg width="22" height="22" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="6"/><circle cx="11" cy="11" r="2" fill="currentColor"/><path d="M11 1v4M11 17v4M1 11h4M17 11h4"/></svg></button>

  <div id="gps"></div>

  <div id="legend"><span><i style="background:var(--lock)"></i>נעולה</span><span><i style="background:var(--open)"></i>נאספה</span><span><i style="background:var(--bad)"></i>טעות</span><span><i style="background:var(--ok)"></i>נפתרה</span></div>
</main>
<div id="sheet" hidden><div class="card" id="card" role="dialog" aria-modal="true"></div></div>

async function answer(id){
  const inp=$('#ai'),btn=$('#ab'),v=inp.value.trim(),n=norm(v);if(!n)return;
  btn.disabled=true;btn.textContent='בודק…';
  const s=byId(id),k=await key(n+'|'+id,s.saltA);let share=null;
  for(const a of s.ans){const r=await dec(k,a);if(r){share=r.s;break}}
  const x=st.s[id];x.tries.push({t:Date.now(),a:v,ok:!!share});
  if(share){x.ok=Date.now();x.sh=share;save();renderPins();

    openStation(id);toast('כל הכבוד! עוד '+(N-solved())+' חידות');

}

async function collect(id,k){
  const s=byId(id);if(!s){toast('התג לא מזוהה');return}
  const r=await dec(await key(k+'|'+id,s.salt),s.riddle);
  if(!r){toast('התג לא מזוהה');return}
  R[id]=r;
  if(!st.s[id]){const now=Date.now();st.s[id]={k,at:now,tries:[]};st.start=st.start||now;save();renderPins();toast('תחנה '+id+' נאספה!')}

}

  const sm=m.length===3&&m[0].startsWith('#')?m:m;

function summary(){
  const end=st.end||Date.now(),L=[`אור במושב: סיכום משחק`,`זמן משחק: ${fmtD(st.start?end-st.start:null)}`,`חידות שנפתרו: ${solved()}/${N}`,`ניקוד: ${DATA.stations.reduce((a,s)=>a+scoreOf(st.s[s.id]),0)}`];
  DATA.stations.forEach(s=>{const x=st.s[s.id];L.push(`${s.id}. ${s.name}: ${x?(x.ok?'נפתרה ב-'+fmtD(x.ok-x.at):'נאספה'):'לא נאספה'}${x?`, טעויות ${x.tries.filter(t=>!t.ok).length}`:''}${x&&x.hint?', רמז':''}`)});
  return L.join('\n');
}
function adminView(){
  if(!isAdmin)return adminLogin();
  const end=st.end||Date.now(),xs=DATA.stations.map(s=>st.s[s.id]);
  const wrong=xs.reduce((a,x)=>a+(x?x.tries.filter(t=>!t.ok).length:0),0),hints=xs.filter(x=>x&&x.hint).length;
  const solvedT=xs.filter(x=>x&&x.ok).map(x=>x.ok-x.at),avg=solvedT.length?solvedT.reduce((a,b)=>a+b,0)/solvedT.length:null;
  const total=xs.reduce((a,x)=>a+scoreOf(x),0);
  const rows=DATA.stations.map((s,i)=>{const x=xs[i];return`<tr><td data-l="תחנה">${s.id}. ${esc(s.name)}</td><td class="n" data-l="נאספה">${clk(x&&x.at)}</td><td class="n" data-l="זמן לפתרון">${x?(x.ok?fmtD(x.ok-x.at):'בתהליך '+fmtD(Date.now()-x.at)):'—'}</td><td class="n" data-l="טעויות">${x?x.tries.filter(t=>!t.ok).length:'—'}</td><td class="n" data-l="רמז קרבה">${clk(st.near&&st.near[s.id])}</td><td class="n" data-l="רמז">${x&&x.hint?'כן':'—'}</td><td class="n" data-l="ניקוד">${scoreOf(x)}</td></tr>`}).join('');
  const log=[];DATA.stations.forEach((s,i)=>{const x=xs[i];if(x)x.tries.filter(t=>!t.ok).forEach(t=>log.push({t:t.t,h:`<li>${clk(t.t)} · תחנה ${s.id}: "${esc(t.a)}"</li>`}))});
  log.sort((a,b)=>a.t-b.t);
  openSheet(`<h2>מסך מנהל המשחק</h2><p class="sub">רק למנהל. השחקנים לא רואים את הנתונים האלה.</p>
  <div class="tiles"><div class="tile"><b>${fmtD(st.start?end-st.start:null)}</b><span>${st.end?'זמן משחק כולל':'זמן משחק עד עכשיו'}</span></div><div class="tile"><b>${solved()}/${N}</b><span>חידות נפתרו</span></div><div class="tile"><b>${total}</b><span>ניקוד</span></div><div class="tile"><b>${fmtD(avg)}</b><span>זמן פתרון ממוצע</span></div><div class="tile"><b>${wrong}</b><span>תשובות שגויות</span></div><div class="tile"><b>${hints}</b><span>רמזים</span></div></div>
  <table class="stack"><thead><tr><th>תחנה</th><th>נאספה</th><th>זמן לפתרון</th><th>טעויות</th><th>רמז קרבה</th><th>רמז</th><th>ניקוד</th></tr></thead><tbody>${rows}</tbody></table>
  <p class="hint">ניקוד לחידה: 100, פחות 15 לכל טעות ו-20 לרמז בחידה, ולא פחות מ-40. רמז קרבה לא מוריד נקודות. זמן לפתרון נמדד מרגע הסריקה.</p>
  <h3 class="sec">תשובות שגויות</h3>${log.length?`<ul class="log">${log.map(l=>l.h).join('')}</ul>`:'<p class="hint">עדיין אין.</p>'}
  ${DATA.demo?`<h3 class="sec">סריקה מדומה (רק בהדגמה)</h3><div class="demo-scan">${DATA.stations.map(s=>`<button class="btn ghost" data-scan="${s.id}">${s.id}. ${esc(s.name)}</button>`).join('')}</div>`:''}
  <div class="acts"><button class="btn" id="cp">העתקת סיכום</button><button class="btn red" id="rs">איפוס משחק</button></div><div id="cpo"></div>`);
  card.querySelectorAll('[data-scan]').forEach(b=>b.onclick=()=>{const id=+b.dataset.scan;collect(id,DATA.demo[id])});
  $('#cp').onclick=async()=>{const t=summary();try{await navigator.clipboard.writeText(t);toast('הסיכום הועתק')}catch(e){$('#cpo').innerHTML=`<textarea readonly>${esc(t)}</textarea>`}};
  let arm=0;$('#rs').onclick=e=>{if(!arm){arm=1;e.target.textContent='לחצו שוב לאישור';setTimeout(()=>{arm=0;const b=$('#rs');if(b)b.textContent='איפוס משחק'},3000);return}st={s:{}};save();for(const k in R)delete R[k];renderPins();toast('המשחק אופס');adminView()};
  clearInterval(sheetTick);if(st.start&&!st.end)sheetTick=setInterval(()=>{if(!sheet.hidden&&card.querySelector('.tiles')){const sc=card.scrollTop;adminView();card.scrollTop=sc}},5000);
}
let lpT;const tt=$('#title');
tt.addEventListener('pointerdown',()=>{lpT=setTimeout(adminView,1200)});
['pointerup','pointerleave','pointercancel'].forEach(ev=>tt.addEventListener(ev,()=>clearTimeout(lpT)));
tt.addEventListener('contextmenu',e=>e.preventDefault());

/* ---------- pan & zoom ---------- */
const vp=$('#vp'),wd=$('#world');let s=1,tx=0,ty=0,minS=.2,MAXS=4;
const clampS=v=>Math.max(minS,Math.min(MAXS,v));
function apply(){wd.style.transform=`translate(${tx}px,${ty}px) scale(${s})`;wd.style.setProperty('--i',1/s);s_=s}
function clampT(){const vw=vp.clientWidth,vh=vp.clientHeight,mw=W*s,mh=H*s;tx=mw<=vw?(vw-mw)/2:Math.min(0,Math.max(vw-mw,tx));ty=mh<=vh?(vh-mh)/2:Math.min(0,Math.max(vh-mh,ty))}
function zoomAt(ns,cx,cy){ns=clampS(ns);const wx=(cx-tx)/s,wy=(cy-ty)/s;s=ns;tx=cx-wx*s;ty=cy-wy*s;clampT();apply()}
function anim(){wd.classList.add('anim');setTimeout(()=>wd.classList.remove('anim'),380)}
function centerOn(x,y,ns){anim();s=clampS(ns||s);tx=vp.clientWidth/2-x*s;ty=vp.clientHeight/2-y*s;clampT();apply()}
function fitAll(){anim();s=minS;clampT();apply()}
function measure(first){minS=Math.min(vp.clientWidth/W,vp.clientHeight/H);if(first){s=clampS(vp.clientWidth/W);tx=0;ty=(vp.clientHeight-H*s)/2}s=clampS(s);clampT();apply()}
const P=new Map();let g=null,dragged=false;
const mid=p=>({x:(p[0].x+p[1].x)/2,y:(p[0].y+p[1].y)/2}),dist=p=>Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y)||1;
function gStart(){const p=[...P.values()],r=vp.getBoundingClientRect();if(p.length===1)g={x:p[0].x,y:p[0].y,tx,ty};else if(p.length>=2){const m=mid(p);g={pinch:1,d:dist(p),s,wx:(m.x-r.left-tx)/s,wy:(m.y-r.top-ty)/s};dragged=true}}
vp.addEventListener('pointerdown',e=>{if(e.target.closest('#ctl'))return;if(!P.size)dragged=false;P.set(e.pointerId,{x:e.clientX,y:e.clientY});gStart()});
addEventListener('pointermove',e=>{if(!P.has(e.pointerId)||!g)return;P.set(e.pointerId,{x:e.clientX,y:e.clientY});const p=[...P.values()],r=vp.getBoundingClientRect();
  if(g.pinch&&p.length>=2){const m=mid(p);s=clampS(g.s*dist(p)/g.d);tx=m.x-r.left-g.wx*s;ty=m.y-r.top-g.wy*s;clampT();apply()}
  else if(!g.pinch){const dx=p[0].x-g.x,dy=p[0].y-g.y;if(!dragged&&Math.hypot(dx,dy)>7)dragged=true;if(dragged){tx=g.tx+dx;ty=g.ty+dy;clampT();apply()}}});
function pEnd(e){if(!P.has(e.pointerId))return;P.delete(e.pointerId);if(P.size){gStart();dragged=true}else g=null}
addEventListener('pointerup',pEnd);addEventListener('pointercancel',pEnd);
vp.addEventListener('click',e=>{if(dragged){e.stopPropagation();e.preventDefault()}},true);
vp.addEventListener('wheel',e=>{e.preventDefault();const r=vp.getBoundingClientRect();zoomAt(s*Math.exp(-e.deltaY*.0015),e.clientX-r.left,e.clientY-r.top)},{passive:false});
vp.addEventListener('dblclick',e=>{if(e.target.closest('.pin,#ctl'))return;const r=vp.getBoundingClientRect();anim();zoomAt(s*1.8,e.clientX-r.left,e.clientY-r.top)});
document.addEventListener('gesturestart',e=>e.preventDefault());
const vc=()=>({x:vp.clientWidth/2,y:vp.clientHeight/2});
$('#zin').onclick=()=>{anim();zoomAt(s*1.5,vc().x,vc().y)};
$('#zout').onclick=()=>{anim();zoomAt(s/1.5,vc().x,vc().y)};
$('#zfit').onclick=fitAll;
$('#pins').addEventListener('click',e=>{const b=e.target.closest('.pin');if(!b)return;if(b.dataset.safe)showFinal();else openStation(+b.dataset.id)});
new ResizeObserver(()=>measure(false)).observe(vp);

/* ---------- GPS ---------- */
const me=$('#me'),gps=$('#gps');let pos=null,aff=null,pos0=0,m2px=1;
const fmtM=m=>m<1000?Math.round(m)+" מ'":(m/1000).toFixed(1)+' ק"מ';
function gpsMsg(t){gps.textContent=t;gps.style.display=t?'block':'none'}
if(DATA.geo&&DATA.geo.length===3){
  // solve x = a*lng + b*lat + c (and same for y) from three anchor points
  const [p,q,r]=DATA.geo,det=(p.lng*(q.lat-r.lat)-p.lat*(q.lng-r.lng)+(q.lng*r.lat-r.lng*q.lat));
  const solve=k=>{const a=(p[k]*(q.lat-r.lat)-p.lat*(q[k]-r[k])+(q[k]*r.lat-r[k]*q.lat))/det,b=(p.lng*(q[k]-r[k])-p[k]*(q.lng-r.lng)+(q.lng*r[k]-r.lng*q[k]))/det,c=(p.lng*(q.lat*r[k]-r.lat*q[k])-p.lat*(q.lng*r[k]-r.lng*q[k])+p[k]*(q.lng*r.lat-r.lng*q.lat))/det;return[a,b,c]};
  const ax=solve('x'),ay=solve('y');m2px=Math.hypot(ax[0],ay[0])/(111320*Math.cos(p.lat*Math.PI/180));
  aff=(lat,lng,acc)=>({x:ax[0]*lng+ax[1]*lat+ax[2],y:ay[0]*lng+ay[1]*lat+ay[2],r:acc*m2px});
}
function unlockNear(id){st.near=st.near||{};if(st.near[id])return;st.near[id]=Date.now();save();renderPins();toast('נפתח רמז למציאת תחנה '+id+'!');try{navigator.vibrate&&navigator.vibrate([120,60,120])}catch(e){}}
function checkNear(c){for(const s of DATA.stations){if(!s.near||st.s[s.id]||(st.near&&st.near[s.id]))continue;if(Math.hypot(c.x-s.x,c.y-s.y)/m2px<=(s.r||DATA.nearR||30))unlockNear(s.id)}}
function onPos(e){
  const c=aff(e.coords.latitude,e.coords.longitude,e.coords.accuracy),M=26;
  const vx=Math.min(W-M,Math.max(M,c.x)),vy=Math.min(H-M,Math.max(M,c.y)),out=vx!==c.x||vy!==c.y;
  pos=Object.assign(c,{vx,vy,out});
  me.style.display='block';me.style.left=vx+'px';me.style.top=vy+'px';me.classList.toggle('out',out);
  if(out){me.style.setProperty('--a',Math.atan2(c.y-vy,c.x-vx)+'rad');gpsMsg('אתם במרחק '+fmtM(Math.hypot(c.x-vx,c.y-vy)/m2px)+' מהמפה')}
  else{const a=$('#acc');a.style.width=a.style.height=Math.max(20,2*c.r)+'px';gpsMsg(DATA.gpsDebug?`דיוק ±${Math.round(e.coords.accuracy)} מ' · ${e.coords.latitude.toFixed(6)}, ${e.coords.longitude.toFixed(6)}`:'');if(!pos0){pos0=1;centerOn(vx,vy,Math.max(s,.6))}}
  checkNear(c);
}
function startGPS(){
  if(!aff||!navigator.geolocation){gpsMsg('אין מיקום במפה הזו');return}
  try{navigator.geolocation.watchPosition(onPos,()=>{gpsMsg('המיקום לא זמין כאן. באתר האמיתי הטלפון יבקש הרשאה.')},{enableHighAccuracy:true,maximumAge:5000})}catch(e){gpsMsg('המיקום לא זמין כאן')}
}
$('#zme').onclick=()=>{if(pos)centerOn(pos.vx,pos.vy,Math.max(s,1));else{gpsMsg(gps.textContent||'מחפש מיקום…');startGPS()}};

/* ---------- boot ---------- */
if($('#houses'))(()=>{const hs=[[380,470],[440,470],[570,470],[630,470],[690,470],[330,800],[390,800],[570,820],[700,820],[360,1120],[420,1120],[580,1120],[640,1120],[150,480],[170,820],[855,480],[860,860],[700,330],[300,330],[330,250],[650,250],[400,600],[580,600]];
  $('#houses').innerHTML=hs.map(([x,y])=>`<use href="#house" x="${x}" y="${y}"/>`).join('');
  const t=[];for(let r=0;r<3;r++)for(let c=0;c<4;c++)t.push(`<use href="#tree" x="${175+c*48+(r%2)*20}" y="${1000+r*38}"/>`);
  $('#orchard').innerHTML=t.join('');})();
if(DATA.demo){let hid=false;try{hid=localStorage.getItem(SK+'-demo')==='x'}catch(e){}if(!hid)$('#demo').hidden=false;$('#demox').onclick=()=>{$('#demo').hidden=true;try{localStorage.setItem(SK+'-demo','x')}catch(e){}}}
measure(true);renderPins();
async function loadR(){for(const sd of DATA.stations){const x=st.s[sd.id];if(x&&x.k&&!R[sd.id]){const r=await dec(await key(x.k+'|'+sd.id,sd.salt),sd.riddle);if(r)R[sd.id]=r}}}
(async()=>{await loadR();if(solved()===N&&!st.fin)await finish();readTag();startGPS()})();
}
</script>
